name: publish acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: jinyongp/homebrew-actions/.github/workflows/check.yml@35be652beb09d97010bfa595069684584b13854c # candidate v1.0.0
    with:
      formula: tap-fixture
      tap-repository: ${{ github.repository }}

  seed:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-check-formula-tap-fixture
          path: Formula
      - name: Seed exact generated Formula
        run: |
          set -euo pipefail
          git add Formula/tap-fixture.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "tap-fixture 1.0.0"
          git push origin "HEAD:main"

  publish:
    needs: seed
    uses: jinyongp/homebrew-actions/.github/workflows/publish.yml@35be652beb09d97010bfa595069684584b13854c # candidate v1.0.0
    with:
      formula: tap-fixture
      ref: ${{ github.sha }}
      version: 1.0.0
      tap-repository: ${{ github.repository }}
    secrets:
      tap_token: ${{ secrets.GITHUB_TOKEN }}
