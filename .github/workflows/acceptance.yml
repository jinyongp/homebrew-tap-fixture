name: publish acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: jinyongp/homebrew-actions/.github/workflows/check.yml@35be652beb09d97010bfa595069684584b13854c # candidate v1.0.0
    with:
      formula: tap-fixture
      tap-repository: ${{ github.repository }}

  seed:
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve fixture version
        id: version
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "version=${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned Homebrew automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jinyongp/homebrew-actions
          ref: 35be652beb09d97010bfa595069684584b13854c
          path: automation
          persist-credentials: false

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tap
          fetch-depth: 0

      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Render exact publish Formula
        uses: ./automation/internal/formula
        with:
          tap-path: tap
          source-path: source
          formula: tap-fixture
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          version: ${{ steps.version.outputs.version }}
          validation-mode: release

      - name: Seed exact generated Formula
        working-directory: tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git add Formula/tap-fixture.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "tap-fixture $VERSION"
          git push origin "HEAD:main"

  publish:
    needs: seed
    uses: jinyongp/homebrew-actions/.github/workflows/publish.yml@35be652beb09d97010bfa595069684584b13854c # candidate v1.0.0
    with:
      formula: tap-fixture
      ref: ${{ github.sha }}
      version: ${{ needs.seed.outputs.version }}
      tap-repository: ${{ github.repository }}
    secrets:
      tap_token: ${{ secrets.GITHUB_TOKEN }}
